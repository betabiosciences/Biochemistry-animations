<body>
    <header>
        <div class="container">
            <h1>Base Excision DNA Repair</h1>
        </div>
    </header>
    
    <div class="container">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="section-container">
            <div class="section-title" id="sectionTitle">Overall Mechanism of Base Excision Repair</div>
            <div class="section-content" id="sectionContent">
                <!-- Content will be dynamically loaded here -->

<footer>
    <div class="footer-content">
        <img src="https://betabiosciences.github.io//Biochemistry-animations/Logo%20transparent.png" 
             alt="BETA Biosciences Logo" class="footer-logo">

    <script>
        // Section data
        const sections = [
            {
                title: "Overall Mechanism of Base Excision Repair",
                content: `
                    <div class="step">
                        <div class="step-title">Step 1: Damage Recognition</div>
                        <p>The process begins when a damaged or inappropriate base is detected in the DNA double helix. Common types of damage include oxidized, deaminated, or alkylated bases that don't belong in the DNA sequence.</p>
                    </div>
                    <div class="step">
                        <div class="step-title">Step 2: Base Excision</div>
                        <p>The damaged base is removed from the DNA backbone, creating an apurinic/apyrimidinic (AP) site. This leaves the sugar-phosphate backbone intact but with a missing base.</p>
                    </div>
                    <div class="step">
                        <div class="step-title">Step 3: Backbone Cleavage</div>
                        <p>The DNA backbone is cleaved at the AP site, creating a single-strand break. This prepares the DNA for the replacement of the missing nucleotide.</p>
                    </div>
                    <div class="step">
                        <div class="step-title">Step 4: End Processing</div>
                        <p>The DNA ends are processed to create suitable substrates for DNA synthesis. This may involve removing blocking groups or creating the correct chemical configuration for DNA polymerase.</p>
                    </div>
                    <div class="step">
                        <div class="step-title">Step 5: Gap Filling</div>
                        <p>A DNA polymerase incorporates the correct nucleotide into the gap, using the complementary strand as a template to ensure accuracy.</p>
                    </div>
                    <div class="step">
                        <div class="step-title">Step 6: Ligation</div>
                        <p>The newly synthesized DNA segment is sealed into place by a DNA ligase, restoring the integrity of the DNA double helix.</p>
                    </div>
                `
            },
            {
                title: "Enzymes Involved in Base Excision Repair",
                content: `
                    <p>Base Excision Repair involves several specialized enzymes that work in a coordinated manner to detect and fix DNA damage:</p>
                    
                    <div class="enzyme-list">
                        <div class="enzyme-item">
                            <div class="enzyme-name">DNA Glycosylases</div>
                            <p>Recognize and remove specific damaged or inappropriate bases by hydrolyzing the glycosidic bond between the base and the deoxyribose sugar.</p>
                        </div>
                        <div class="enzyme-item">
                            <div class="enzyme-name">AP Endonuclease</div>
                            <p>Cleave the DNA backbone at apurinic/apyrimidinic (AP) sites created after base removal, generating a single-strand break.</p>
                        </div>
                        <div class="enzyme-item">
                            <div class="enzyme-name">DNA Polymerase</div>
                            <p>Fill in the single nucleotide gap or short patch of nucleotides using the undamaged strand as a template.</p>
                        </div>
                        <div class="enzyme-item">
                            <div class="enzyme-name">DNA Ligase</div>
                            <p>Seal the remaining nick in the DNA backbone after nucleotide insertion, completing the repair process.</p>
                        </div>
                        <div class="enzyme-item">
                            <div class="enzyme-name">Flap Endonuclease</div>
                            <p>In long-patch repair, removes the displaced DNA flap created during strand displacement synthesis.</p>
                        </div>
                        <div class="enzyme-item">
                            <div class="enzyme-name">Proliferating Cell Nuclear Antigen (PCNA)</div>
                            <p>A sliding clamp that increases the processivity of DNA polymerase during the repair synthesis step.</p>
                        </div>
                    </div>
                    
                    <div class="step" style="margin-top: 20px;">
                        <div class="step-title">Coordination of Enzymes</div>
                        <p>These enzymes work in a sequential and coordinated manner, often forming transient complexes to ensure efficient repair. The choice between short-patch and long-patch repair pathways depends on the specific type of DNA damage and the enzymes involved.</p>
                    </div>
                `
            },
            {
                title: "Repair by Monofunctional Glycosylase",
                content: `
                    <p>Monofunctional glycosylases recognize and remove specific damaged bases but possess only glycosylase activity, not lyase activity. After base removal, additional enzymes are required to complete the repair process.</p>
                    
                    <div class="step">
                        <div class="step-title">Initial Steps</div>
                        <p>The monofunctional glycosylase recognizes a specific type of damaged base and cleaves the glycosidic bond, releasing the damaged base and creating an AP site.</p>
                    </div>

                <div class="image-container">
                <img src="https://betabiosciences.github.io//Biochemistry-animations/BER%20monofunctional.png" alt="Monohybrid Cross Diagram">
                </div>
                    
                    <div class="step">
                        <div class="step-title">Short-Patch Repair Pathway</div>
                        <p>This is the predominant pathway for most base lesions:</p>
                        <ol style="margin-left: 20px; margin-top: 10px;">
                            <li>AP endonuclease cleaves the DNA backbone 5' to the AP site</li>
                            <li>DNA polymerase β removes the 5'-deoxyribose phosphate</li>
                            <li>A single nucleotide is inserted by DNA polymerase β</li>
                            <li>DNA ligase III/XRCC1 complex seals the nick</li>
                        </ol>
                        <p style="margin-top: 10px;">Short-patch repair replaces just one nucleotide and is the more efficient pathway for most base damages.</p>
                    </div>
                    
                    <div class="step">
                        <div class="step-title">Long-Patch Repair Pathway</div>
                        <p>This pathway is used when the 5'-terminus is resistant to cleavage by DNA polymerase β:</p>
                        <ol style="margin-left: 20px; margin-top: 10px;">
                            <li>DNA polymerase δ/ε performs strand displacement synthesis</li>
                            <li>2-8 nucleotides are incorporated, displacing a DNA flap</li>
                            <li>Flap endonuclease 1 (FEN1) removes the displaced flap</li>
                            <li>DNA ligase I seals the remaining nick</li>
                        </ol>
                        <p style="margin-top: 10px;">Long-patch repair is less common but necessary for certain types of DNA damage that create blocking groups at the 5'-end.</p>
                    </div>
                    
                    <div class="step">
                        <div class="step-title">Examples of Monofunctional Glycosylases</div>
                        <p>These include UNG (uracil-DNA glycosylase), which removes uracil from DNA, and MPG (alkylpurine-DNA glycosylase), which repairs alkylation damage.</p>
                    </div>
                `
            },
            {
                title: "Repair by Bifunctional Glycosylase",
                content: `
                    <p>Bifunctional glycosylases possess both glycosylase and lyase activities, allowing them to not only remove damaged bases but also cleave the DNA backbone at the resulting AP site.</p>
                    
                    <div class="step">
                        <div class="step-title">Dual Functionality</div>
                        <p>These enzymes first cleave the glycosidic bond to release the damaged base, then use their lyase activity to cleave the DNA backbone through a β-elimination reaction.</p>
                    </div>
                <div class="image-container">
                <img src="https://betabiosciences.github.io//Biochemistry-animations/BER%20bifunctional.png" alt="Monohybrid Cross Diagram">
                </div>
                    
                    <div class="step">
                        <div class="step-title">Repair Process</div>
                        <ol style="margin-left: 20px;">
                            <li>The bifunctional glycosylase recognizes and binds to the damaged base</li>
                            <li>Glycosylase activity removes the damaged base, creating an AP site</li>
                            <li>Lyase activity cleaves the DNA backbone 3' to the AP site</li>
                            <li>AP endonuclease cleaves 5' to the AP site, generating a single-nucleotide gap</li>
                            <li>DNA polymerase β fills the gap with the correct nucleotide</li>
                            <li>DNA ligase III/XRCC1 seals the nick</li>
                        </ol>
                    </div>
                    
                   
                    <div class="step">
                        <div class="step-title">Examples of Bifunctional Glycosylases</div>
                        <p>These include OGG1 (8-oxoguanine glycosylase), which repairs oxidative damage, and NEIL1, NEIL2, and NEIL3, which have broad substrate specificity for oxidative base damage.</p>
                    </div>
                    
                    <div class="step">
                        <div class="step-title">Biological Significance</div>
                        <p>Bifunctional glycosylases are particularly important for repairing oxidative DNA damage, which is constantly generated by cellular metabolism and environmental factors. Their dual activity makes the repair process more efficient by combining two steps into one enzyme.</p>
                    </div>
                `
            }
        ];

        // Current section index
        let currentSection = 0;

        // DOM elements
        const sectionTitle = document.getElementById('sectionTitle');
        const sectionContent = document.getElementById('sectionContent');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');

        // Function to update the displayed section
        function updateSection() {
            sectionTitle.textContent = sections[currentSection].title;
            sectionContent.innerHTML = sections[currentSection].content;
            
            // Update progress bar
            progressBar.style.width = `${((currentSection + 1) / sections.length) * 100}%`;
            
            // Update button states
            prevBtn.disabled = currentSection === 0;
            nextBtn.textContent = currentSection === sections.length - 1 ? 'Finish' : 'Next';
        }

        // Event listeners for navigation buttons
        prevBtn.addEventListener('click', () => {
            if (currentSection > 0) {
                currentSection--;
                updateSection();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentSection < sections.length - 1) {
                currentSection++;
                updateSection();
            } else {
                // Optionally reset to first section or show completion message
                currentSection = 0;
                updateSection();
            }
        });

        // Initialize the first section
        updateSection();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Disable print functionality
            document.addEventListener('keydown', function(e) {
                // Disable Ctrl+P
                if (e.ctrlKey && e.keyCode === 80) {

                // Disable Print Screen key
                if (e.keyCode === 44) {

                // Disable F12 (DevTools)
                if (e.keyCode === 123) {

                // Disable Ctrl+Shift+I (DevTools)
                if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                    e.preventDefault();
                    return false;
                }
                
                // Disable Ctrl+U (View Source)
                if (e.ctrlKey && e.keyCode === 85) {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Disable right-click context menu
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Disable text selection and dragging
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;
            });
            
            document.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Detect print command from browser menu (using beforeprint event)
            window.addEventListener('beforeprint', function(event) {
                // Cancel the print event
                event.preventDefault();
                return false;
            });
            
            // Another approach to catch print attempts from browser menu
            if (window.matchMedia) {
                const mediaQueryList = window.matchMedia('print');
                mediaQueryList.addListener(function(mql) {
                    if (mql.matches) {
                        // Cancel the print by immediately closing the print dialog
                        setTimeout(function() {
                            window.print = function() {};
                        }, 100);
                    }
                });
            }
        });
        
        // Override the window.print function
        window.print = function() {
            return false;
        };
        
        // Add an event listener for the print event
        window.onbeforeprint = function() {
            return false;
        };
        
        // Make it difficult to iframe the content
        if (window !== window.top) {
            window.top.location = window.location;
        }
    </script>
