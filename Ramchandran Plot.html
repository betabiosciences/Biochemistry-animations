        var gk_isXlsx = false;

        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <h1>Ramachandran Plot</h1>

    <h2>What is a Ramachandran Plot?</h2>
    <p>The Ramachandran plot, developed by G.N. Ramachandran, is a fundamental tool in structural biology. It's a specific type of scatter plot used to visualize the energetically allowed and disallowed regions for the backbone dihedral angles, phi (φ) and psi (ψ), of amino acid residues in a protein structure. By analyzing these angles, scientists can assess the quality of a protein model and understand its secondary structure.</p>
    <p>The plot's foundation is the hard-sphere model. This model treats atoms as solid spheres with defined van der Waals radii. The "allowed" regions in the plot correspond to φ/ψ angle combinations where atoms do not clash or overlap, while "forbidden" regions represent combinations that would cause steric hindrance, which is energetically unfavorable.</p>

    <h2>Allowed vs. Forbidden Regions</h2>
    <p>The Ramachandran plot is typically divided into three main areas based on steric feasibility:</p>
    <ul>
        <li><strong>Core (Most Favored) Regions:</strong> These are the vibrant purple areas on the plot. They represent φ/ψ combinations with no steric clashes, corresponding to the most stable and common secondary structures.</li>
        <li><strong>Allowed (Generously Allowed) Regions:</strong> The bright blue areas. Here, atoms are slightly closer than the sum of their van der Waals radii, creating minor steric strain. These conformations are less common but still possible.</li>
        <li><strong>Disallowed Regions:</strong> The dark, uncolored areas. In these conformations, atoms are too close, leading to significant steric clashes. Amino acid residues (except Glycine) are very rarely found in these regions.</li>
    </ul>
    <p>75% of the total area in a Ramachandran Plot is forbidden. All the regular Secondary structures in proteins exist in the remaining 25%.</p>

    <h2>Exceptions: Glycine and Proline</h2>
    <h3>Glycine</h3>
    <p>Glycine lacks a side chain (its R-group is just a hydrogen atom). This absence of a bulky side chain removes many steric constraints, giving it far greater conformational freedom. Its Ramachandran plot shows allowed regions that are symmetric about the origin (0°, 0°), including areas that are forbidden for all other amino acids.</p>

    <h3>Proline</h3>
    <p>Proline's side chain is unique because it loops back and bonds to its own backbone nitrogen atom, forming a rigid five-membered ring. This ring structure severely restricts rotation around the φ angle, locking it at approximately -65°. Consequently, its Ramachandran plot shows only a very narrow, vertically-oriented allowed region.</p>

    <h2>The Proteomic Ramachandran Plot</h2>
    <p>A Proteomic Ramachandran plot aggregates the (φ, ψ) angles from a massive database of high-resolution protein structures (e.g., from the Protein Data Bank). Instead of just showing theoretical allowed/disallowed regions, it displays the actual observed distribution of residues as a density map. These plots provide a more nuanced, data-driven view of protein conformations and are invaluable for validating new structures against the known universe of protein folds.</p>

    <h2>Applications of the Ramachandran Plot</h2>
    <ul>
        <li><strong>Structure Validation:</strong> Its primary use is to check the quality of experimentally determined or computationally predicted protein structures.</li>
        <li><strong>Model Refinement:</strong> During the process of solving a protein structure, the plot helps scientists identify and correct regions with unlikely backbone conformations.</li>
        <li><strong>Understanding Protein Dynamics:</strong> By identifying residues in less common "allowed" regions, researchers can gain insights into flexible or functionally important parts of a protein.</li>
        <li><strong>Protein Design:</strong> When designing new proteins, the plot serves as a guide to ensure that the designed sequence can fold into a stable, sterically valid conformation.</li>
    </ul>
