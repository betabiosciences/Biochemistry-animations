                    <p>At the replication fork, the parental DNA duplex is unwound into two single-stranded templates. The fork advances along the chromosome at approximately <span class="highlight">1000 nucleotides per second</span> in E. coli, making it one of the fastest molecular motors known. The asymmetric nature of DNA strands (5' to 3' directionality) creates distinct requirements for synthesis on each template strand.</p>

                    <h3>Primary Mechanism: DNA Polymerase I</h3>
                    <p>DNA Polymerase I is the principal enzyme responsible for primer removal in E. coli through its unique combination of activities:</p>
                    
                    <h4>Nick Translation by Pol I</h4>
                    <p>Pol I performs "nick translation" - simultaneous removal and replacement:</p>
                    <ul>
                        <li><span class="highlight">Initial recognition:</span> Pol I recognizes the nick (single-strand break) at the junction between the RNA primer and the previously synthesized DNA of an Okazaki fragment</li>
                        <li><span class="highlight">5' to 3' exonuclease activity:</span> The N-terminal domain of Pol I hydrolyzes the phosphodiester bond ahead of the nick, removing nucleotides from the 5' end (including RNA and possibly some DNA)
                            <ul>
                                <li>Binds to the 5' terminus at the nick</li>
                                <li>Cleaves the phosphodiester bond, releasing mononucleotides or short oligonucleotides</li>
                                <li>Can remove both ribonucleotides and deoxyribonucleotides</li>
                                <li>Processively removes nucleotides one at a time from the 5' end</li>
                            </ul>
                        </li>
                        <li><span class="highlight">Simultaneous DNA synthesis:</span> The C-terminal polymerase domain of Pol I simultaneously synthesizes DNA from the 3'-OH at the nick, filling in the gap created by exonuclease activity
                            <ul>
                                <li>Uses the template strand to direct synthesis</li>
                                <li>Incorporates dNTPs to replace the removed RNA</li>
                                <li>Moves the nick in the 5' to 3' direction along the DNA</li>
                            </ul>
                        </li>
                        <li><span class="highlight">Net result:</span> The nick "translates" along the DNA, progressively replacing RNA with DNA</li>
                    </ul>
                    
                    <h3>Step-by-Step Process</h3>
                    <ol>
                        <li><span class="highlight">Okazaki fragment completion:</span> DNA Pol III synthesizes an Okazaki fragment until it encounters the RNA primer of the previous fragment, leaving a nick</li>
                        <li><span class="highlight">Pol I recruitment:</span> DNA Pol I binds to the nick structure, recognizing the discontinuity in the DNA strand</li>
                        <li><span class="highlight">Nick translation:</span> Pol I simultaneously removes the RNA primer using its 5' to 3' exonuclease while filling in with DNA using its polymerase activity
                            <ul>
                                <li>Typically removes 10-12 ribonucleotides</li>
                                <li>May remove additional deoxyribonucleotides beyond the primer</li>
                                <li>Synthesizes DNA to fill the gap</li>
                            </ul>
                        </li>
                        <li><span class="highlight">Final nick:</span> After complete primer removal and gap filling, a single nick remains between the newly synthesized DNA and the 5' end of the downstream Okazaki fragment</li>
                        <li><span class="highlight">Ligation:</span> DNA ligase seals this final nick (discussed in next section)</li>
                    </ol>
                    <div class="image-container">
                        <img src="https://betabiosciences.github.io/Biochemistry-animations/Primer%20remoal%20prokaryote.png" alt="Primer Removal Diagram">
                    </div>

                    
                    <h3>Alternative and Backup Pathways</h3>
                    
                    <h4>RNase H</h4>
                    <p>RNase H enzymes can contribute to primer removal:</p>
                    <ul>
                        <li><span class="highlight">RNase HI:</span> Cleaves RNA in RNA-DNA hybrids, generating multiple cleavage sites within the primer
                            <ul>
                                <li>Degrades most of the primer but typically leaves 1-2 ribonucleotides at the RNA-DNA junction</li>
                                <li>Creates internal cleavages in longer primers</li>
                                <li>Not essential for viability as Pol I can compensate</li>
                            </ul>
                        </li>
                    </ul>
                `
            }
        };

        function displaySection(sectionNum) {
            const wrapper = document.getElementById('content-wrapper');
            wrapper.innerHTML = `<div class="content-section active">${sections[sectionNum].content}</div>`;
        }

        function updateSection() {
            displaySection(currentSection);
            document.getElementById('current-section').textContent = currentSection;
            document.getElementById('prev-btn').disabled = currentSection === 1;
            document.getElementById('next-btn').disabled = currentSection === totalSections;
            document.getElementById('content-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function navigateSection(direction) {
            const newSection = currentSection + direction;
            if (newSection >= 1 && newSection <= totalSections) {
                currentSection = newSection;
                updateSection();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                navigateSection(-1);
            } else if (e.key === 'ArrowRight') {
                navigateSection(1);
            }
        });

        // Initialize the page
        updateSection();
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Disable print functionality
            document.addEventListener('keydown', function(e) {
                // Disable Ctrl+P
                if (e.ctrlKey && e.keyCode === 80) {
                    e.preventDefault();
                    return false;
                }
                
                // Disable Print Screen key
                if (e.keyCode === 44) {
                    e.preventDefault();
                    return false;
                }
                
                // Disable F12 (DevTools)
                if (e.keyCode === 123) {
                    e.preventDefault();
                    return false;
                }
                
                // Disable Ctrl+Shift+I (DevTools)
                if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                    e.preventDefault();
                    return false;
                }
                
                // Disable Ctrl+U (View Source)
                if (e.ctrlKey && e.keyCode === 85) {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Disable right-click context menu
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Disable text selection and dragging
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;
            });
            
            document.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Detect print command from browser menu (using beforeprint event)
            window.addEventListener('beforeprint', function(event) {
                // Cancel the print event
                event.preventDefault();
                return false;
            });
            
            // Another approach to catch print attempts from browser menu
            if (window.matchMedia) {
                const mediaQueryList = window.matchMedia('print');
                mediaQueryList.addListener(function(mql) {
                    if (mql.matches) {
                        // Cancel the print by immediately closing the print dialog
                        setTimeout(function() {
                            window.print = function() {};
                        }, 100);
                    }
                });
            }
        });
        
        // Override the window.print function
        window.print = function() {
            return false;
        };
        
        // Add an event listener for the print event
        window.onbeforeprint = function() {
            return false;
        };
        
        // Make it difficult to iframe the content
        if (window !== window.top) {
            window.top.location = window.location;
        }
    </script>
