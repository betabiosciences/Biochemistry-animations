    <main class="max-w-4xl mx-auto space-y-8">

            <h2 class="text-2xl font-bold mb-4 text-white">1. What is Secondary Structure?</h2>
            <p class="text-lg mb-4 text-gray-300">
                Secondary structure refers to the <span class="highlight">local, repeating spatial arrangements</span> of the main-chain atoms (the "backbone") of a polypeptide chain. It describes how segments of the polymer fold into regular, ordered patterns. Think of it as the first level of intricate folding after the simple linear chain of amino acids (primary structure).

            <p class="text-lg mb-4 text-gray-300">
                Imagine you have two pieces of cardboard connected by a single piece of tape acting as a hinge. A dihedral angle is simply the angle you create between the two pieces of cardboard as you fold them.
            </p>
            <p class="text-lg mb-4 text-gray-300">
                In chemistry, instead of cardboard, we have planes formed by atoms. A dihedral angle measures the <strong class="accent-text">twist</strong> around a central chemical bond. To define it, you need four atoms (let's call them A-B-C-D). The angle measures the rotation around the central <strong class="highlight">B-C</strong> bond.

                <div class="flex justify-center gap-4 mt-4">

                    </button>

                </div>
                <p id="dihedral-note" class="text-center text-gray-400 mt-4 hidden">
                    As you rotate the central bond, notice the <strong class="accent-text">spatial displacement</strong> of atoms A and D (the extreme atoms) relative to each other.
                </p>
            </div>
        </section>

        <!-- Section 3: The Peptide Bond and Omega Angle -->
        <section id="peptide-bond" class="card p-6 rounded-xl section">
            <h2 class="text-2xl font-bold mb-4 text-white">3. The Backbone's Constraint: The Peptide Bond</h2>
            <p class="text-lg mb-4 text-gray-300">
                The key to understanding protein folding lies in the properties of the peptide bond (the C-N bond linking amino acids). Due to <span class="highlight">resonance</span>, this bond has about 40% double-bond character. This has a profound consequence: <strong class="accent-text">it cannot rotate freely</strong>.
            </p>
            <p class="text-lg mb-4 text-gray-300">
                This rigidity forces the <strong class="highlight">four atoms (C&alpha;-C-N--C&alpha;)</strong> into a single plane. The dihedral angle around this peptide bond is called <strong class="font-bold text-white">Omega (&omega;)</strong>.
            </p>

            <div class="mt-6">
                <h3 class="font-semibold text-lg mb-2 text-white">The Proline Exception:</h3>
                <p class="text-gray-300">
                    For all amino acids except Proline, the <em class="accent-text">trans</em> form is >1000 times more stable than <em class="accent-text">cis</em> <strong class="highlight">because in trans state the bulky sidechain groups are on the opposite side and are thus maximally away from each other. This reduces the steric clashes between atoms.</strong> However, in an <strong class="highlight">X-Proline</strong> peptide bond, the energy difference is much smaller. Proline's cyclic side chain is already bulky, making both cis and trans conformations sterically hindered. Consequently, about 5-10% of Proline peptide bonds in proteins are found in the *cis* configuration (&omega; &approx; 0&deg;), often introducing sharp turns or kinks in the structure.

        <!-- Section 4: The Flexible Hinges: Phi and Psi Angles -->
        <section id="phi-psi" class="card p-6 rounded-xl section">

            <p class="text-lg mb-4 text-gray-300">

            </p>
            <p class="text-lg mb-4 text-gray-300">
                In the context of the polypeptide chain, <strong class="highlight">"i" refers to the current amino acid residue</strong>, <strong class="highlight">"i-1" refers to the preceding amino acid residue</strong>, and <strong class="highlight">"i+1" refers to the succeeding amino acid residue</strong>. This notation helps specify which atoms from which residues are involved in defining the angles.
            </p>
            
            <!-- Phi Angle -->
            <div class="bg-gray-900 p-6 rounded-lg mt-6">
                <h3 class="text-xl font-semibold text-white">The Phi (&phi;) Angle</h3>
                <p class="mb-4 text-gray-400">Rotation around the <strong class="highlight">N—C&alpha;</strong> bond. It involves the atoms: <span class="font-mono">C(i-1) - N(i) - C&alpha;(i) - C(i)</span>.</p>
                <p class="text-center text-gray-400 mt-4">Note: The phi angle measures the spatial displacement of <strong class="accent-text">Carbonyl groups</strong>.</p>
                <div id="phi-3d-container">

            <!-- Psi Angle -->
            <div class="bg-gray-900 p-6 rounded-lg mt-8">
                <h3 class="text-xl font-semibold text-white">The Psi (&psi;) Angle</h3>
                <p class="mb-4 text-gray-400">Rotation around the <strong class="highlight">C&alpha;—C</strong> bond. It involves the atoms: <span class="font-mono">N(i) - C&alpha;(i) - C(i) - N(i+1)</span>.</p>
                <p class="text-center text-gray-400 mt-4">Note: The psi angle measures the spatial displacement of <strong class="accent-text">Amino groups</strong>.</p>
                <div id="psi-3d-container">
                    <canvas id="psi-3d-canvas"></canvas>
                    <div class="canvas-watermark">
                        <img src="https://betabiosciences.github.io/Biochemistry-animations/Logo%20transparent.png" alt="BETA Biosciences Logo" onerror="handleLogoError()">
                        <p>BETA Biosciences</p>
                    </div>
                </div>
                <div class="mt-4">
                    <label for="psi-slider" class="interactive-label">ROTATE PSI (&psi;)</label>
                    <input type="range" id="psi-slider" min="-180" max="180" value="0" class="w-full">

            <div class="mt-8 p-4 border border-dashed border-gray-700 rounded-lg">
                <h4 class="font-semibold text-lg text-white">A Note on Rotation Direction (+/-)</h4>
                <p class="mt-2 text-gray-300">By convention, a <strong class="accent-text">positive (+)</strong> rotation is a <strong class="highlight">clockwise</strong> turn of the rear group when looking down the bond from front to back. A <strong class="accent-text">negative (-)</strong> rotation is counter-clockwise. The combination of specific &phi; and &psi; angles for a series of amino acids defines the shape of a secondary structure like an &alpha;-helix or &beta;-sheet.</p>
            </div>

                // Function to handle logo loading error
                function handleLogoError() {
                    // Display a blank page by clearing the body content
                    document.body.innerHTML = '';
                }

                // Global variables for Three.js scene (Dihedral Explainer)
                let scene, camera, renderer, controls;
                let atomA, atomB, atomC, atomD;
                let bondAB, bondBC, bondCD;
                let explainerGroup; // Group for the dihedral atoms (A, B, C, D) and bonds (AB, BC, CD)

                // Global variables for Peptide 3D scene
                let peptideScene, peptideCamera, peptideRenderer, peptideControls;
                let peptideAtomCa1, peptideAtomC, peptideAtomN, peptideAtomCa2;
                let peptideBondCa1C, peptideBondCN, peptideBondNCa2;
                let peptideRotatingPart;

                // Global variables for Phi 3D scene
                let phiScene, phiCamera, phiRenderer, phiControls;
                let phiAtomCPrev, phiAtomN, phiAtomCa, phiAtomCNext;
                let phiBondCPrevN, phiBondNCa, phiBondCaCNext;
                let phiRotatingPart;

                // Global variables for Psi 3D scene
                let psiScene, psiCamera, psiRenderer, psiControls;
                let psiAtomN, psiAtomCa, psiAtomC, psiAtomNNext;
                let psiBondNCa, psiBondCaC, psiBondCNNext;
                let psiRotatingPart;


                // Atom and Bond Geometries/Materials parameters (moved to global scope)
                const atomRadius = 0.5;
                const bondRadius = 0.15;
                const bondLength = 3; // Distance between atoms

                // Helper function to create and position a bond between two points
                function createBond(startPoint, endPoint, material) {
                    const direction = new THREE.Vector3().subVectors(endPoint, startPoint);
                    const length = direction.length();
                    const bondGeometry = new THREE.CylinderGeometry(bondRadius, bondRadius, length, 32);
                    const bond = new THREE.Mesh(bondGeometry, material);

                    bond.position.copy(startPoint).add(endPoint).divideScalar(2);

                    // Align the cylinder's Y-axis with the direction vector
                    bond.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());

                    return bond;
                }

                // Helper function to create a text label (sprite)
                function createTextLabel(text, color, fontSize, position) {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    const font = \`\${fontSize}px Arial\`;
                    context.font = font;
                    const metrics = context.measureText(text);
                    const textWidth = metrics.width;
                    const textHeight = fontSize;

                    canvas.width = textWidth + 10; // Add padding
                    canvas.height = textHeight + 10; // Add padding
                    context.font = font;
                    context.fillStyle = color;
                    context.fillText(text, 5, fontSize + 2); // Position text with padding

                    const texture = new THREE.CanvasTexture(canvas);

                function initDihedral3D() {
                    const container = document.getElementById('dihedral-3d-container');
                    const canvas = document.getElementById('dihedral-3d-canvas');
                    const width = container.clientWidth;
                    const height = container.clientHeight;

                    // Scene
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x222222); // Dark background for the 3D scene

                    // Camera
                    camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                    camera.position.z = 10;

                    // Renderer
                    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
                    renderer.setSize(width, height);
                    renderer.setPixelRatio(window.devicePixelRatio);

                    // OrbitControls
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true; // Animate damping
                    controls.dampingFactor = 0.05;
                    controls.screenSpacePanning = false;
                    controls.minDistance = 5;
                    controls.maxDistance = 20;

                    // Lights
                    const ambientLight = new THREE.AmbientLight(0x404040); // soft white light
                    scene.add(ambientLight);
                    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                    directionalLight.position.set(1, 1, 1).normalize();
                    scene.add(directionalLight);

                    // Materials for atoms (using MeshStandardMaterial for better lighting)
                    const atomMaterialA = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.2, roughness: 0.5 }); // Gold
                    const atomMaterialB = new THREE.MeshStandardMaterial({ color: 0xFF4500, metalness: 0.2, roughness: 0.5 }); // Orange Red
                    const atomMaterialC = new THREE.MeshStandardMaterial({ color: 0x00BFFF, metalness: 0.2, roughness: 0.5 }); // Deep Sky Blue
                    const atomMaterialD = new THREE.MeshStandardMaterial({ color: 0x7FFF00, metalness: 0.2, roughness: 0.5 }); // Chartreuse
                    const bondMaterial = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.1, roughness: 0.8 });

                    const sphereGeometry = new THREE.SphereGeometry(atomRadius, 32, 32);

                    // Create atoms
                    atomA = new THREE.Mesh(sphereGeometry, atomMaterialA);
                    atomB = new THREE.Mesh(sphereGeometry, atomMaterialB);
                    atomC = new THREE.Mesh(sphereGeometry, atomMaterialC);
                    atomD = new THREE.Mesh(sphereGeometry, atomMaterialD);
                    
                    // Create a group to hold the dihedral atoms and bonds for easier rotation
                    explainerGroup = new THREE.Group();
                    scene.add(explainerGroup);

                    // Position atoms
                    // B is at origin (0,0,0)
                    atomB.position.set(0, 0, 0);

                    // C is connected to B, along X-axis
                    atomC.position.set(bondLength, 0, 0);

                    // A is connected to B, along Y-axis (forming a plane with B and C)
                    atomA.position.set(0, bondLength, 0);

                    // D will be positioned relative to C, and rotate around the B-C bond (X-axis)
                    // Initial position of D relative to C's local origin (0,0,0) for the rotating group
                    // IMPORTANT: Changed to positive Y so that at 0 degrees, A and D are on the same side (cis)
                    atomD.position.set(0, bondLength, 0); 

                    // Create bonds using the helper function
                    bondAB = createBond(atomB.position, atomA.position, bondMaterial);
                    bondBC = createBond(atomB.position, atomC.position, bondMaterial);
                    
                    // Create a group for atomD and bondCD that pivots around atomC's position,
                    // and rotates around the X-axis (which is the B-C bond axis).
                    const rotatingDihedralPart = new THREE.Group();
                    rotatingDihedralPart.position.copy(atomC.position); // Set pivot to C's position
                    explainerGroup.add(rotatingDihedralPart);

                    // Bond CD (local to rotatingDihedralPart)
                    // It connects the origin of rotatingDihedralPart (which is atomC's world position) to atomD's local position
                    bondCD = createBond(new THREE.Vector3(0,0,0), atomD.position, bondMaterial);

                    rotatingDihedralPart.add(atomD);
                    rotatingDihedralPart.add(bondCD);

                    explainerGroup.add(atomA, atomB, atomC, bondAB, bondBC); // Add fixed parts

                    // Add labels to atoms - REVERTED TO ORIGINAL A, B, C, D
                    const labelOffset = 0.8; // Distance from the atom center
                    explainerGroup.add(createTextLabel('A', '#FFFFFF', 48, atomA.position.clone().add(new THREE.Vector3(0, labelOffset, 0))));
                    explainerGroup.add(createTextLabel('B', '#FFFFFF', 48, atomB.position.clone().add(new THREE.Vector3(0, labelOffset, 0))));
                    explainerGroup.add(createTextLabel('C', '#FFFFFF', 48, atomC.position.clone().add(new THREE.Vector3(0, labelOffset, 0))));
                    
                    // Label D needs to be added to the rotating part so it moves with atomD
                    // Its position is relative to atomD's local position, with a negative Y offset to place it below
                    const labelD = createTextLabel('D', '#FFFFFF', 48, atomD.position.clone().add(new THREE.Vector3(0, -labelOffset, 0)));
                    rotatingDihedralPart.add(labelD);


                    // Store the rotating part for later manipulation
                    explainerGroup.rotatingDihedralPart = rotatingDihedralPart;

                    // Adjust camera to frame the molecule
                    camera.position.set(bondLength * 1.5, bondLength * 1.5, bondLength * 3);
                    camera.lookAt(explainerGroup.position);

                    window.addEventListener('resize', onDihedralWindowResize, false);
                }

                    const width = container.clientWidth;

                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(width, height);
                }

                                score++;
                                feedbackDiv.classList.add('correct');
                                feedbackDiv.textContent = \`Correct! Your answer: \${q.options[userAnswerIndex]}\`;
                            } else {
                                feedbackDiv.classList.add('incorrect');
                                feedbackDiv.textContent = \`Incorrect. Your answer: \${q.options[userAnswerIndex]}. Correct answer: \${q.options[q.correctAnswerIndex]}\`;
                            }
                        } else {
                            feedbackDiv.classList.add('incorrect');
                            feedbackDiv.textContent = \`You didn't answer this question. Correct answer: \${q.options[q.correctAnswerIndex]}\`;
                        }
                        questionDiv.appendChild(feedbackDiv);

                        // Disable all radio buttons for this question after submission
                        const radioButtons = questionDiv.querySelectorAll(\`input[name="question\${qIndex}"]\`);
                        radioButtons.forEach(radio => radio.disabled = true);
                    });

                    document.getElementById('score').textContent = score;
                    document.getElementById('quiz-results').classList.remove('hidden');
                    document.getElementById('submit-quiz-btn').classList.add('hidden'); // Hide submit button
                }


                document.addEventListener('DOMContentLoaded', () => {
                    sections = document.querySelectorAll('.section');
                    nextSectionBtn = document.getElementById('next-section-btn');
                    const submitQuizBtn = document.getElementById('submit-quiz-btn');

                    // Initialize all 3D scenes
                    initDihedral3D();
                    initPeptide3D();
                    initPhi3D();
                    initPsi3D();

                    // Start the animation loops (they will render even if canvases are hidden,
                    // but the resize will fix the dimensions when they become visible)
                    animateDihedral3D();
                    animatePeptide3D();
                    animatePhi3D();
                    animatePsi3D();

                    // Render the quiz questions
                    renderQuiz();

                    // Show the first section initially
                    if (sections.length > 0) {
                        showSection(currentSectionIndex);
                    }

                    nextSectionBtn.addEventListener('click', () => {
                        if (currentSectionIndex < sections.length - 1) {
                            currentSectionIndex++;
                            showSection(currentSectionIndex);
                        } else {
                            // All sections viewed, go back to the first section
                            currentSectionIndex = 0;
                            showSection(currentSectionIndex);
                            window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll to top
                            // When returning to the first section, reset quiz state
                            document.getElementById('quiz-results').classList.add('hidden');
                            document.getElementById('submit-quiz-btn').classList.remove('hidden');
                            renderQuiz(); // Re-render quiz to clear selections and feedback
                        }
                    });

                    submitQuizBtn.addEventListener('click', (e) => {
                        e.preventDefault(); // Prevent form submission
                        checkAnswers();
                    });


                    // --- Peptide Bond Cis/Trans Toggler (Now controls 3D model) ---
                    const toggleBtn = document.getElementById('toggle-peptide-bond');
                    const peptideExplanation = document.getElementById('peptide-explanation');
                    let isPeptideCis = true; // Changed to track cis state, starts at cis

                    // Set initial state for peptide bond on load
                    if (peptideRotatingPart) {
                        peptideRotatingPart.rotation.x = THREE.MathUtils.degToRad(0); // Default to cis
                        peptideExplanation.innerHTML = 'In the <strong class="accent-text">Cis</strong> configuration (&omega; &approx; 0&deg;), the bulky C&alpha; atoms are on the same side, causing a <strong class="text-red-400">steric clash</strong>.';
                        toggleBtn.textContent = 'Show Trans (&omega; = 180\u00B0)';
                    }

                    toggleBtn.addEventListener('click', () => {
                        isPeptideCis = !isPeptideCis;
                        if (isPeptideCis) {
                            if (peptideRotatingPart) {
                                peptideRotatingPart.rotation.x = THREE.MathUtils.degToRad(0);
                            }
                            toggleBtn.textContent = 'Show Trans (&omega; = 180\u00B0)';
                            peptideExplanation.innerHTML = 'In the <strong class="accent-text">Cis</strong> configuration (&omega; &approx; 0&deg;), the bulky C&alpha; atoms are on the same side, causing a <strong class="text-red-400">steric clash</strong>.';
                        } else {
                            if (peptideRotatingPart) {
                                peptideRotatingPart.rotation.x = THREE.MathUtils.degToRad(180);
                            }
                            toggleBtn.textContent = 'Show Cis (&omega; = 0\u00B0)';
                            peptideExplanation.innerHTML = 'In the <strong class="accent-text">Trans</strong> configuration (&omega; &approx; 180&deg;), the bulky C&alpha; atoms are on opposite sides, which is sterically favorable.';
                        }
                    });

                    // --- Dihedral Explainer Slider for 3D ---
                    const explainerSlider = document.getElementById('explainer-slider');
                    const explainerValue = document.getElementById('explainer-value');
                    const dihedralNote = document.getElementById('dihedral-note'); // Get the note element
                    const angle0Btn = document.getElementById('angle-0-btn');
                    const angle180Btn = document.getElementById('angle-180-btn');
                    
                    explainerSlider.addEventListener('input', (e) => {
                        const angleDeg = parseFloat(e.target.value);
                        explainerValue.textContent = angleDeg;
                        
                        const angleRad = THREE.MathUtils.degToRad(angleDeg);
                        // Rotate the group containing atomD and bondCD around the X-axis (B-C bond)
                        if (explainerGroup && explainerGroup.rotatingDihedralPart) {
                            explainerGroup.rotatingDihedralPart.rotation.x = angleRad;
                        }

                        // Show the note when the slider is moved
                        dihedralNote.classList.remove('hidden');
                        dihedralNote.innerHTML = 'As you rotate the central bond, notice the <strong class="accent-text">spatial displacement</strong> of atoms A and D (the extreme atoms) relative to each other.'; // Reverted note text
                    });

                    angle0Btn.addEventListener('click', () => {
                        explainerSlider.value = 0;
                        explainerValue.textContent = 0;
                        explainerGroup.rotatingDihedralPart.rotation.x = THREE.MathUtils.degToRad(0);
                        dihedralNote.classList.remove('hidden');
                        dihedralNote.innerHTML = 'Note that now the atom A and D are on the same side relative to the rotated bond and are said to be in <span class="accent-text">cis-conformation</span>.'; // Reverted note text
                    });

                    angle180Btn.addEventListener('click', () => {
                        explainerSlider.value = 180;
                        explainerValue.textContent = 180;
                        explainerGroup.rotatingDihedralPart.rotation.x = THREE.MathUtils.degToRad(180);
                        dihedralNote.classList.remove('hidden');
                        dihedralNote.innerHTML = 'Note that now the atom A and D are on opposite sides relative to the rotated bond and are said to be in <span class="accent-text">trans-conformation</span>.'; // Reverted note text
                    });


                    // --- Phi Angle Slider (Now controls 3D model) ---
                    const phiSlider = document.getElementById('phi-slider');
                    const phiValue = document.getElementById('phi-value'); 
                    
                    phiSlider.addEventListener('input', (e) => {
                        const angleDeg = parseFloat(e.target.value);
                        phiValue.textContent = angleDeg;
                        const angleRad = THREE.MathUtils.degToRad(angleDeg);
                        if (phiRotatingPart) {
                            phiRotatingPart.rotation.x = angleRad;
                        }
                    });

                    // --- Psi Angle Slider (Now controls 3D model) ---
                    const psiSlider = document.getElementById('psi-slider');
                    const psiValue = document.getElementById('psi-value');
                    
                    psiSlider.addEventListener('input', (e) => {
                        const angleDeg = parseFloat(e.target.value);
                        psiValue.textContent = angleDeg;
                        const angleRad = THREE.MathUtils.degToRad(angleDeg);
                        if (psiRotatingPart) {
                            psiRotatingPart.rotation.x = angleRad;
                        }
                    });
                });

                window.onload = function() {
                    // This ensures Three.js initialization happens after the DOM is fully loaded.
                    // The DOMContentLoaded listener handles this, but keeping onload for robustness.
                };

                // --- Security Measures ---

                // Disable right-click context menu
                document.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                });

                // Disable Ctrl+P / Cmd+P for printing
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                        e.preventDefault();
                    }
                });

                // Override window.print() to do nothing
                window.print = () => {};

                // Optional: Disable F12 (Developer Tools) - This is generally not recommended as it can hinder debugging
                // document.addEventListener('keydown', (e) => {
                //     if (e.key === 'F12') {
                //         e.preventDefault();
                //     }
                // });
                `;
                document.body.appendChild(script);
            } else {
                // Not on allowed domain - silently fail by not loading any content
                document.body.innerHTML = '';
            }
        })();
    </script>
</body>
